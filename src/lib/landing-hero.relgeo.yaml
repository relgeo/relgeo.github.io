version: 0.5

meta:
  title: Living Blueprint Hero
  version: "hero-study-01"

scene:
  unit: px
  orientation: y-up
  autoSize: true
  padding: 0

constants:
  mainRadius: 92
  innerRadius: 58
  upperRadius: 76
  lowerRadius: 76

metaPresets:
  axis:
    stroke: "#0f6370"
    strokeWidth: 1
    fill: none
  construction:
    stroke: "#e9a23b"
    strokeWidth: 0.8
    dash: "4 5"
    fill: none
    opacity: 0.72
  final:
    stroke: "#162033"
    strokeWidth: 2.4
    fill: none
  surface:
    stroke: "#162033"
    strokeWidth: 1.8
    fill: "#0f6370"
    opacity: 0.88
  surfaceLight:
    stroke: "#162033"
    strokeWidth: 1.3
    fill: "#7aaeb1"
    opacity: 0.8
  annotation:
    stroke: "#f05a47"
    fill: "#f05a47"
    fontSize: 10
    arrowSize: 4

objects:
  origin:
    type: point
    at: [0, 0]
    meta:
      fill: "#162033"
  mainCenter:
    type: point
    at: [132, 0]
  upperCenter:
    type: point
    at: [-8, 112]
  lowerCenter:
    type: point
    at: [-118, -58]
  axisX:
    type: line
    from: [-220, 0]
    to: [260, 0]
    metaPreset: axis
  axisY:
    type: line
    from: [0, -150]
    to: [0, 220]
    metaPreset: axis
  parallelGuide:
    type: line
    from: [-190, 90]
    to: [220, 90]
    metaPreset: construction
  mainCircle:
    type: circle
    center: mainCenter
    radius: mainRadius
    metaPreset: construction
  innerCircle:
    type: circle
    center: mainCenter
    radius: innerRadius
    metaPreset: final
  rightRing:
    type: circle
    center: mainCenter
    radius: mainRadius
    holes:
      - circle:
          center: mainCenter
          radius: innerRadius
    metaPreset: surface
  upperGuide:
    type: circle
    center: upperCenter
    radius: upperRadius
    metaPreset: construction
  lowerGuide:
    type: circle
    center: lowerCenter
    radius: lowerRadius
    metaPreset: construction
  constructionArc:
    type: arc
    center: origin
    radius: 190
    startAngle: -18deg
    endAngle: 154deg
    metaPreset: construction
  tangentReference:
    type: point
    at: [-190, 112]
  tangentLine:
    type: line
    tangent:
      from: tangentReference
      to: mainCircle
      pick: first
    metaPreset: construction
  leftTip:
    type: point
    at: [-190, -68]
  upperJoin:
    type: point
    at: [16, 94]
  upperPeak:
    type: point
    at: [70, 184]
  upperExit:
    type: point
    at: [188, 72]
  lowerJoin:
    type: point
    at: [18, -42]
  lowerExit:
    type: point
    at: [198, -18]
  upperSweep:
    type: path
    closed: true
    segments:
      - cubic:
          from: leftTip
          cp1: [-112, -28]
          cp2: [-22, 30]
          to: upperJoin
      - cubic:
          cp1: [38, 154]
          cp2: [52, 190]
          to: upperPeak
      - cubic:
          cp1: [118, 180]
          cp2: [170, 128]
          to: upperExit
      - cubic:
          cp1: [130, 55]
          cp2: [62, 52]
          to: leftTip
    metaPreset: surface
  lowerSweep:
    type: path
    closed: true
    segments:
      - cubic:
          from: leftTip
          cp1: [-132, -62]
          cp2: [-70, -82]
          to: lowerJoin
      - cubic:
          cp1: [72, -76]
          cp2: [140, -58]
          to: lowerExit
      - cubic:
          cp1: [132, -8]
          cp2: [70, 36]
          to: lowerJoin
      - cubic:
          cp1: [12, 18]
          cp2: [-78, -30]
          to: leftTip
    metaPreset: surfaceLight
  upperContour:
    type: path
    closed: false
    segments:
      - cubic:
          from: leftTip
          cp1: [-112, -28]
          cp2: [-22, 30]
          to: upperJoin
      - cubic:
          cp1: [38, 154]
          cp2: [52, 190]
          to: upperPeak
      - cubic:
          cp1: [118, 180]
          cp2: [170, 128]
          to: upperExit
    metaPreset: final
  lowerContour:
    type: path
    closed: false
    segments:
      - cubic:
          from: leftTip
          cp1: [-132, -62]
          cp2: [-70, -82]
          to: lowerJoin
      - cubic:
          cp1: [72, -76]
          cp2: [140, -58]
          to: lowerExit
    metaPreset: final
  tangentNote:
    type: annotation
    text: "tangent"
    target: tangentLine
    metaPreset: annotation
  concentricNote:
    type: annotation
    text: "concentric"
    target: mainCircle
    place:
      right: mainCircle.right + 16
      top: mainCircle.top + 14
    metaPreset: annotation
  equalRadiusNote:
    type: annotation
    text: "equal radius"
    target: upperGuide
    metaPreset: annotation

constraints:
  - equal:
      left: upperGuide.radius
      right: lowerGuide.radius
  - perpendicular: [axisX, axisY]
  - parallel: [axisX, parallelGuide]
